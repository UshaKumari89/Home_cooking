    <div class="container">

        <form id="form">
        <h2>Register here</h2>
            <img src="images/img_avatar2.png" alt="Avatar" class="avatar">
      
          
           <!-- /** 
             * ! user name Input
             **/ -->
          <div>
            <label for="userFirstname">First Name</label>
            <i class="fa-solid fa-user"></i>
            <input type="text" name="userFirstName" id="userFirstName" placeholder = "John " />
            <i class="fa-solid fa-circle-exclamation failure-icon"></i>
            <i class="fa-solid fa-circle-check success-icon"></i>
            <div class="error"></div>
          </div>
           <!-- /** 
             * ! user Last Input
             **/ -->
          <div>
              <label for="userLastname">Last Name</label>
              <i class="fa-solid fa-user"></i>
              <input type="text" name="userLastName" id="userLastName" placeholder = "Deo" />
              <i class="fa-solid fa-circle-exclamation failure-icon"></i>
              <i class="fa-solid fa-circle-check success-icon"></i>
              <div class="error"></div>
            </div>
          <!-- /** 
             * ! Email Input
             **/ -->
          <div>
            <label for="email">Email</label>
            <i class="fa-solid fa-envelope"></i>
            <input type="email" name="email" id="email" placeholder = "xyz@gmail.com"/>
            <i class="fa-solid fa-circle-exclamation failure-icon"></i>
            <i class="fa-solid fa-circle-check success-icon"></i>
            <div class="error"></div>
          </div>
  
          <!-- /** 
             * ! Password Input
             **/ -->
          <div>
            <label for="password">Password</label>
            <i class="fa-solid fa-lock"></i>
            <input type="password" name="password" id="password" placeholder = "Password"/>
            <i class="fa-solid fa-circle-exclamation failure-icon"></i>
            <i class="fa-solid fa-circle-check success-icon"></i>
            <div class="error"></div>
          </div>
          <button type="submit" id = "submit" class = "btn mt-3">Log In</button>
        </form>
    </div>
